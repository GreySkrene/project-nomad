<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NOMAD — Field Map</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="app">
  <header class="topbar"><div class="brand"><span class="mark">⌖</span>NOMAD Field Map</div><label class="search">⌕ <input aria-label="Search" placeholder="Search saved places or coordinates"></label><span class="pill good">USA • Canada • Mexico saved</span></header>
  <main class="main">
    <div class="map" aria-label="Stylized offline route map"><div class="road a"></div><div class="road b"></div><div class="road c"></div><span class="map-label slc">Salt Lake Valley</span><span class="map-label rex">Rexburg</span><span class="map-label mary">Marysvale</span>
      <section class="map-panel"><h2>Saved emergency places</h2><div class="row"><span><strong>Home</strong><br><span class="muted small">West Jordan area</span></span>⌂</div><div class="row"><span><strong>Family route north</strong><br><span class="muted small">Salt Lake → Rexburg</span></span>↗</div><div class="row"><span><strong>Family route south</strong><br><span class="muted small">Salt Lake → Marysvale</span></span>↘</div><div class="warning" style="margin-top:11px">Offline map. Closures and evacuation orders require live verification.</div></section>
    </div>
    <div class="toolbar"><button class="button">⌖ Saved places</button><button class="button">△ Terrain</button><button class="button">▤ Hazard plans</button><button class="button ghost">Open routing app</button></div>
  </main>
</div>
<a class="button back" href="index.html">← All examples</a>
</body></html>
